[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"

# Single-page app: known pages load the app normally...
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/shop"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/product/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/cart"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/checkout"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/track"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/account"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/about"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/contact"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/privacy"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

# ...and anything else shows the app's "page not found" view with a real 404 status.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
